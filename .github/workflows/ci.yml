name: CI

# Runs the same checks as local dev (typecheck + lint + the full vitest suite)
# on every push to main and every PR. macOS runner so the native deps (node-pty)
# and shell-spawning tests behave like they do on the supported platform.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref cancels the older in-progress run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # node-pty installs via `node scripts/prebuild.js || node-gyp rebuild`, so it
      # prefers a DOWNLOADED prebuilt binary. On macOS it needs two artifacts: the
      # pty.node addon and a separate `spawn-helper` executable. A prebuilt helper
      # that does not match the runner (wrong arch, or no exec bit) still lets
      # pty.node load, then fails at spawn time with "posix_spawnp failed" -- which
      # is how the pty suite failed on the first CI run. Compiling from source makes
      # both artifacts match this machine.
      #
      # NOTE: this is `npm rebuild` (NODE abi), NOT `npm run rebuild` (which is
      # electron-rebuild). vitest runs under plain Node, so building for Electron's
      # ABI here would break these very tests. Do not "simplify" it to the other one.
      - name: Build node-pty from source
        run: npm rebuild node-pty --build-from-source --foreground-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        # --retry=2: one suite test spawns a real login shell and is mildly
        # timing-flaky under CI load; a retry keeps the badge honest, not red.
        run: npm test -- --retry=2
